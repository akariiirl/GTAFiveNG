name: Source-only tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MPLBACKEND: Agg
      SYNTHETIC_ARTIFACT_DIR: ci-synthetic
      MPLCONFIGDIR: .mpl-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: python -m pip install -r requirements-cloud.txt
      - run: python tools/run_tests.py --output ci-synthetic/test-summary.json
      - run: python tools/streaming_showcase.py --output ci-synthetic/showcase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-evidence-${{ matrix.os }}
          path: |
            ci-synthetic/test-summary.json
            ci-synthetic/comparison.json
            ci-synthetic/comparison.png
            ci-synthetic/synthetic_asset_density.png
            ci-synthetic/synthetic_neighborhood_progress.png
            ci-synthetic/synthetic_conversion_heatmap.png
            ci-synthetic/synthetic_progress_summary.json
            ci-synthetic/showcase/**
          retention-days: 14
  reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.428'
      - run: |
          git clone https://github.com/dexyfex/CodeWalker.git vendor/CodeWalker
          git -C vendor/CodeWalker checkout 485d56bec00262ed7fa472261cce7bbc6202b96e
          dotnet build src/AssetReader/AssetReader.csproj -c Release
      - run: python tools/check_reader_protocol.py src/AssetReader/bin/Release/net8.0/AssetReader.dll
